version: 2

# This repo is a compose file and a Caddyfile, nothing else — no application
# dependencies to track, so the only supply chain worth watching is the caddy
# image itself. That image terminates TLS for everything behind it, which is
# exactly why it should not go stale.
#
# Every entry carries a 3-day cooldown: a version that gets yanked shortly
# after publishing never reaches a PR.
#
# No `github-actions` entry: this repo has no workflows, and a github-actions
# entry pointed at a repo without them is not inert — Dependabot aborts the job
# with "/action.yml or /.github/workflows/<anything>.yml not found" and reports a
# failed run every week. Add the entry at the same time as the first workflow.

updates:
  # ---- compose service images ----
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Helsinki
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, docker]
    cooldown:
      default-days: 3
    groups:
      compose-minor-patch:
        update-types: [minor, patch]
