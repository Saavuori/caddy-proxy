version: 2

# This repo is a compose file and a Caddyfile, nothing else — no application
# dependencies to track, so the only supply chain worth watching is the caddy
# image itself. That image terminates TLS for everything behind it, which is
# exactly why it should not go stale.
#
# Every entry carries a 3-day cooldown: a version that gets yanked shortly
# after publishing never reaches a PR.

updates:
  # ---- compose service images ----
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Helsinki
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, docker]
    cooldown:
      default-days: 3
    groups:
      compose-minor-patch:
        update-types: [minor, patch]

  # ---- GitHub Actions ----
  # Added with the first workflows (ci.yml and dependabot-automerge.yml). Before
  # they existed this entry would have failed the Dependabot job every week with
  # "/action.yml or /.github/workflows/<anything>.yml not found".
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Helsinki
    commit-message:
      prefix: chore
      include: scope
    labels: [dependencies, ci]
    cooldown:
      default-days: 3
    groups:
      actions-minor-patch:
        update-types: [minor, patch]
